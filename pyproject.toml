[project]
name = "pynvr"
version = "2.0.2"
description = "pynvr is a NVR used to record events from cameras"
authors = [{ name = "Gordon Aspin", email = "gordon.aspin@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

dependencies = [
    "click==8.4.1",
    "opencv-contrib-python-headless==4.13.0.92",
    "scikit-image==0.26.0",
    "ultralytics==8.4.66",
    "ultralytics-thop==2.0.20",
    "aiortc==1.14.0",
    "fastapi==0.136.3",
    "bcrypt==4.3.0",
    "passlib==1.7.4",
    "uvicorn==0.49.0",
    "keyring==25.7.0",
]

[project.scripts]
pynvr = "pynvr.app:main"

[project.urls]
Repository = "https://github.com/gordonaspin/pynvr"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["pynvr*"]
exclude = ["logs*", "recordings*", "frontend*"]

[tool.pylint]
disable = [
    "import-error",
    "logging-not-lazy",
    "logging-fstring-interpolation",
    "no-member",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "no-value-for-parameter",
    "too-few-public-methods",
    "broad-exception-caught",
]

